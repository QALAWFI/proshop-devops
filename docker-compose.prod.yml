services:
  mongo:
    image: mongo:7
    container_name: proshop-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: abdulrzzaq/proshop-backend:latest
    container_name: proshop-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/proshop
      JWT_SECRET: ${JWT_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
    volumes:
      - uploads-data:/app/uploads
      - uploads-data:/var/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/api/products > /dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: abdulrzzaq/proshop-frontend:latest
    container_name: proshop-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  uploads-data:
